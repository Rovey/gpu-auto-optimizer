<text x="56" y="804" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="15" font-weight="400" fill="#E6E8ED" text-anchor="start">Administrator</text>
<text x="56" y="824" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="13" font-weight="400" fill="#7A8390" text-anchor="start">Can tune the card</text>
<text x="252" y="54" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="22" font-weight="600" fill="#E6E8ED" text-anchor="start">Optimize</text>
<text x="252" y="78" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="13" font-weight="400" fill="#99A3B0" text-anchor="start">Every result is measured against your card at stock. If it does not hold or does not gain, nothing is kept.</text>
<text x="276" y="154" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="15" font-weight="600" fill="#E6E8ED" text-anchor="start">What do you want from your card?</text>
<rect x="276" y="168" width="412" height="68" rx="6" fill="#242830"/>
<circle cx="296" cy="191" r="8" fill="none" stroke="#4A94FF" stroke-width="1.5"/>
<circle cx="296" cy="191" r="4" fill="#4A94FF"/>
<text x="312" y="196" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="15" font-weight="600" fill="#E6E8ED" text-anchor="start">All in one</text>
<text x="676" y="196" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="13" font-weight="400" fill="#7A8390" text-anchor="end">40 min</text>
<text x="312" y="220" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="13" font-weight="400" fill="#99A3B0" text-anchor="start">Faster, on less power, with quieter fans</text>
<circle cx="296" cy="263" r="8" fill="none" stroke="#3D4552" stroke-width="1.5"/>
<text x="312" y="268" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="15" font-weight="600" fill="#E6E8ED" text-anchor="start">Best of my GPU</text>
<text x="676" y="268" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="13" font-weight="400" fill="#7A8390" text-anchor="end">15 min</text>
<text x="312" y="292" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="13" font-weight="400" fill="#99A3B0" text-anchor="start">As fast as it stays stable, with a margin</text>
<circle cx="296" cy="335" r="8" fill="none" stroke="#3D4552" stroke-width="1.5"/>
<text x="312" y="340" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="15" font-weight="600" fill="#E6E8ED" text-anchor="start">Max performance</text>
<text x="676" y="340" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="13" font-weight="400" fill="#7A8390" text-anchor="end">15 min</text>
<text x="312" y="364" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="13" font-weight="400" fill="#99A3B0" text-anchor="start">The most speed; warmer (83 °C) and louder</text>
<circle cx="296" cy="407" r="8" fill="none" stroke="#3D4552" stroke-width="1.5"/>
<text x="312" y="412" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="15" font-weight="600" fill="#E6E8ED" text-anchor="start">Undervolt</text>
<text x="676" y="412" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="13" font-weight="400" fill="#7A8390" text-anchor="end">13 min</text>
<text x="312" y="436" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="13" font-weight="400" fill="#99A3B0" text-anchor="start">Stock speed on less power and heat</text>
<circle cx="296" cy="479" r="8" fill="none" stroke="#3D4552" stroke-width="1.5"/>
<text x="312" y="484" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="15" font-weight="600" fill="#E6E8ED" text-anchor="start">Quiet</text>
<text x="676" y="484" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="13" font-weight="400" fill="#7A8390" text-anchor="end">15 min</text>
<text x="312" y="508" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="13" font-weight="400" fill="#99A3B0" text-anchor="start">Lower fan noise; some speed given up</text>
<circle cx="296" cy="551" r="8" fill="none" stroke="#3D4552" stroke-width="1.5"/>
<text x="312" y="556" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="15" font-weight="600" fill="#E6E8ED" text-anchor="start">Cool &amp; efficient</text>
<text x="676" y="556" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="13" font-weight="400" fill="#7A8390" text-anchor="end">15 min</text>
<text x="312" y="580" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="13" font-weight="400" fill="#99A3B0" text-anchor="start">Coolest (65 °C); speed given up</text>
<text x="744" y="154" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="18" font-weight="600" fill="#E6E8ED" text-anchor="start">All in one</text>
<text x="1124" y="154" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="13" font-weight="400" fill="#7A8390" text-anchor="end">Recommended</text>
<text x="744" y="184" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="15" font-weight="400" fill="#99A3B0" text-anchor="start">An overclock with an undervolt on top, then the quietest</text>
<text x="744" y="206" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="15" font-weight="400" fill="#99A3B0" text-anchor="start">fan curve that holds the temperature.</text>
<text x="744" y="244" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="13" font-weight="400" fill="#99A3B0" text-anchor="start">Changes</text>
<text x="845" y="244" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="15" font-weight="400" fill="#E6E8ED" text-anchor="start">Power limit, core, memory, curve, fans</text>
<text x="744" y="274" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="13" font-weight="400" fill="#99A3B0" text-anchor="start">Takes</text>
<text x="845" y="274" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="15" font-weight="400" fill="#E6E8ED" text-anchor="start">About 40 minutes of full load</text>
<text x="744" y="304" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="13" font-weight="400" fill="#99A3B0" text-anchor="start">Limit</text>
<text x="845" y="304" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="15" font-weight="400" fill="#E6E8ED" text-anchor="start">75 °C</text>
<text x="744" y="334" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="13" font-weight="400" fill="#99A3B0" text-anchor="start">Kept if</text>
<text x="845" y="334" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="15" font-weight="400" fill="#E6E8ED" text-anchor="start">It holds a 5-minute final test</text>
<text x="744" y="380" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="15" font-weight="600" fill="#E6E8ED" text-anchor="start">Before you start</text>
