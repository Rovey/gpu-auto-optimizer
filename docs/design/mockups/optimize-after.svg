<text x="768" y="410" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="15" font-weight="400" fill="#E6E8ED" text-anchor="start">No other program is using the card.</text>
<text x="768" y="430" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="13" font-weight="400" fill="#7A8390" text-anchor="start">Checked again when you press Start.</text>
