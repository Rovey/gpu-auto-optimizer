<text x="768" y="458" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="15" font-weight="400" fill="#E6E8ED" text-anchor="start">The screen can go black for a few seconds. Save your</text>
<text x="768" y="480" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="15" font-weight="400" fill="#E6E8ED" text-anchor="start">work first.</text>
<circle cx="751" cy="505" r="7" fill="#99A3B0"/>
<circle cx="751" cy="501.85" r="0.96" fill="#111317"/>
<line x1="751" y1="504.44" x2="751" y2="508.5" stroke="#111317" stroke-width="1.6" stroke-linecap="round"/>
<text x="768" y="510" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="15" font-weight="400" fill="#E6E8ED" text-anchor="start">Abort puts the card back at any moment.</text>
