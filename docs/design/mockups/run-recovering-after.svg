<text x="308" y="239" font-family="Segoe UI, 'Segoe UI Variable', sans-serif" font-size="15" font-weight="400" fill="#99A3B0" text-anchor="start">The graphics driver was reset while the run tested core +330 MHz. A reset can happen</text>
