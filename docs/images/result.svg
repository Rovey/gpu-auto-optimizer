<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img" aria-labelledby="t d" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
  <title id="t">One click: 4.5 % more performance on the reference RTX 4070</title>
  <desc id="d">Stress-test score 5736 iterations per second at stock and 5996 after one run of the Best of my GPU profile. Core clock offset +135 MHz, memory clock offset +1600 MHz, power limit 105 %.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#0b111d"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="858" height="428" rx="16" fill="url(#bg)" stroke="#24344f" stroke-width="2"/>

  <text x="40" y="52" fill="#8fa0b8" font-size="13" font-weight="600" letter-spacing="1.6">MEASURED ON THE REFERENCE CARD</text>

  <text x="38" y="128" fill="#ffffff" font-size="72" font-weight="700" letter-spacing="-1">+4.5 %</text>
  <text x="300" y="98" fill="#e6edf3" font-size="27" font-weight="600">performance from one click</text>
  <text x="300" y="126" fill="#8fa0b8" font-size="15">Best of my GPU · one 12-minute run · safety margin applied · 300 s soak passed</text>

  <!-- Stress-test score, zero-based bars: 5736 and 5996 it/s on a 600 px scale of 6000 -->
  <text x="40" y="181" fill="#8fa0b8" font-size="14">Stock</text>
  <rect x="100" y="168" width="574" height="16" rx="4" fill="#4b5b75"/>
  <text x="690" y="181" fill="#e6edf3" font-size="14" font-weight="600">5736 it/s</text>
  <text x="40" y="213" fill="#8fa0b8" font-size="14">Tuned</text>
  <rect x="100" y="200" width="600" height="16" rx="4" fill="#3b82f6"/>
  <text x="716" y="213" fill="#e6edf3" font-size="14" font-weight="600">5996 it/s</text>

  <g>
    <rect x="40" y="246" width="248" height="112" rx="12" fill="#152037" stroke="#24344f"/>
    <text x="60" y="276" fill="#8fa0b8" font-size="13" font-weight="600" letter-spacing="1.2">CORE CLOCK</text>
    <text x="60" y="315" fill="#ffffff" font-size="30" font-weight="700">+135 MHz</text>
    <text x="60" y="340" fill="#8fa0b8" font-size="13">fails at +225, confirmed at +210</text>

    <rect x="306" y="246" width="248" height="112" rx="12" fill="#152037" stroke="#24344f"/>
    <text x="326" y="276" fill="#8fa0b8" font-size="13" font-weight="600" letter-spacing="1.2">MEMORY CLOCK</text>
    <text x="326" y="315" fill="#ffffff" font-size="30" font-weight="700">+1600 MHz</text>
    <text x="326" y="340" fill="#8fa0b8" font-size="13">fails at +2550, confirmed at +2300</text>

    <rect x="572" y="246" width="248" height="112" rx="12" fill="#152037" stroke="#24344f"/>
    <text x="592" y="276" fill="#8fa0b8" font-size="13" font-weight="600" letter-spacing="1.2">POWER LIMIT</text>
    <text x="592" y="315" fill="#ffffff" font-size="30" font-weight="700">105 %</text>
    <text x="592" y="340" fill="#8fa0b8" font-size="13">187 W to 204 W, peak 71 °C</text>
  </g>

  <text x="40" y="396" fill="#6f8099" font-size="13">NVIDIA GeForce RTX 4070 · driver 617.14 · score of the built-in stress test (DirectX 11 compute) · games gain a different amount</text>
</svg>
